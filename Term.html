<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root{
      --bg:#090b12;
      --line:rgba(255,255,255,.13);
      --pink:#ff3d81;
      --purple:#8b5cf6;
      --blue:#38bdf8;
      --gold:#ffd166;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      color:#f8fafc;
      font-family:"Anek Latin","Noto Sans Bengali",system-ui,sans-serif;
      background:
        radial-gradient(circle at 8% 5%, rgba(255,61,129,.18), transparent 28%),
        radial-gradient(circle at 92% 12%, rgba(56,189,248,.14), transparent 24%),
        linear-gradient(145deg,#070812 0%,#111827 55%,#080812 100%);
    }

    .glass{
      background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
      border:1px solid var(--line);
      box-shadow:0 24px 70px rgba(0,0,0,.36);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
    }

    .term-card{
      background:rgba(255,255,255,.062);
      border:1px solid rgba(255,255,255,.115);
      transition:.22s ease;
    }

    .term-card:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,.09);
      border-color:rgba(255,61,129,.36);
    }

    .main-btn{
      background:linear-gradient(135deg,#ff3d81,#8b5cf6 55%,#38bdf8);
      color:white;
      box-shadow:0 18px 46px rgba(255,61,129,.26);
      transition:.22s ease;
    }

    .main-btn:not(:disabled):hover{
      transform:translateY(-2px);
      box-shadow:0 24px 60px rgba(139,92,246,.36);
    }

    .main-btn:disabled{
      opacity:.42;
      cursor:not-allowed;
      box-shadow:none;
    }

    .lang-btn{
      border:1px solid rgba(255,255,255,.13);
      background:rgba(255,255,255,.07);
      color:#cbd5e1;
      transition:.18s ease;
    }

    .lang-btn.active{
      background:linear-gradient(135deg,rgba(255,61,129,.34),rgba(139,92,246,.34));
      color:white;
      border-color:rgba(255,255,255,.28);
    }

    .info-dot{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:22px;
      height:22px;
      margin-left:6px;
      border-radius:999px;
      background:rgba(255,209,102,.16);
      border:1px solid rgba(255,209,102,.35);
      color:#ffd166;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      vertical-align:middle;
    }

    .modal-backdrop{opacity:0;pointer-events:none;transition:.22s ease}
    .modal-backdrop.active{opacity:1;pointer-events:auto}
    .modal-box{opacity:0;transform:translateY(18px) scale(.96);transition:.22s ease}
    .modal-backdrop.active .modal-box{opacity:1;transform:translateY(0) scale(1)}

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(16px)}
      to{opacity:1;transform:translateY(0)}
    }
    .fade-up{animation:fadeUp .65s ease both}
  </style>
</head>

    const validLangs = ["English", "Hinglish", "Assamese"];
    const params = new URLSearchParams(window.location.search);
    let currentLang = params.get("lan") || params.get("lang") || localStorage.getItem("termsLang") || "Hinglish";
    currentLang = validLangs.find(l => l.toLowerCase() === String(currentLang).toLowerCase()) || "Hinglish";

    const yearEl = document.getElementById("year");
    const agreeCheck = document.getElementById("agreeCheck");
    const agreeBtn = document.getElementById("agreeBtn");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalText = document.getElementById("modalText");
    const closeModal = document.getElementById("closeModal");
    const okModal = document.getElementById("okModal");

    yearEl.textContent = new Date().getFullYear();

    function setLanguage(lang, updateUrl = true){
      currentLang = lang;
      localStorage.setItem("termsLang", lang);
      document.documentElement.lang = lang === "Assamese" ? "as" : "en";

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        if(translations[lang][key]) el.textContent = translations[lang][key];
      });

      document.querySelectorAll("[data-lang-btn]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.langBtn === lang);
      });

      if(updateUrl){
        const url = new URL(window.location.href);
        url.searchParams.set("lan", lang);
        window.history.replaceState({}, "", url);
      }
    }

    setLanguage(currentLang, false);

    document.querySelectorAll("[data-lang-btn]").forEach(btn => {
      btn.addEventListener("click", () => setLanguage(btn.dataset.langBtn, true));
    });

    agreeCheck.addEventListener("change", () => {
      agreeBtn.disabled = !agreeCheck.checked;
    });

    document.querySelectorAll(".info-dot").forEach(btn => {
      btn.addEventListener("click", () => {
        const t = translations[currentLang];
        const type = btn.dataset.popup;

        if(type === "hosting"){
          modalTitle.textContent = t.hostingTitle;
          modalText.textContent = t.hostingText;
        }

        if(type === "refund"){
          modalTitle.textContent = t.refundTitle;
          modalText.textContent = t.refundText;
        }

        if(type === "support"){
          modalTitle.textContent = t.supportTitle;
          modalText.textContent = t.supportText;
        }

        modal.classList.add("active");
      });
    });

    function hideModal(){ modal.classList.remove("active"); }
    closeModal.addEventListener("click", hideModal);
    okModal.addEventListener("click", hideModal);
    modal.addEventListener("click", e => { if(e.target === modal) hideModal(); });
    document.addEventListener("keydown", e => { if(e.key === "Escape") hideModal(); });

    agreeBtn.addEventListener("click", () => {
      if(!agreeCheck.checked) return;

      const pageLink = window.location.href && window.location.href !== "about:blank" ? window.location.href : "Terms page link";
      const today = new Date().toLocaleDateString("en-IN");
      const t = translations[currentLang];

      const message =
`${t.whatsappMsg}

Terms Page Link: ${pageLink}
Language: ${currentLang}
Date: ${today}`;

      const whatsappUrl = `https://wa.me/${developerWhatsAppNumber}?text=${encodeURIComponent(message)}`;
      window.open(whatsappUrl, "_blank");
    });
  </script>
</body>
</html>
